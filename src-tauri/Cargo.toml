[package]
name = "harnessx"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harnessx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" unlocks multi-webview, which the in-app browser pane needs. Tauri
# marks it unstable because the API may change across minor versions — the
# version is pinned tightly below so an upgrade is a deliberate act.
tauri = { version = "2.11", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
sysinfo = "0.33"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
sha2 = "0.10"
base64 = "0.22"
# Archive extraction in-process: works identically on Windows and Linux, and drops
# the PowerShell Expand-Archive dependency.
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
flate2 = "1"
tar = "0.4"
rand = "0.8"
open = "5"
url = "2"

# Local WebSocket bridge to the browser extension. The extension runs inside the
# user's real browser, so automation reuses their existing logins instead of a
# blank automated profile.
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-tungstenite = "0.24"

# Keychain backend per platform: Credential Manager on Windows, Secret Service
# (gnome-keyring / kwallet) on Linux. With no backend compiled in, saving an API
# key fails at runtime rather than at build time — hence the explicit split.
# NOTE: these tables must stay at the end of the file; anything after a [target.*]
# table belongs to that table, not to [dependencies].
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "sync-secret-service",
    "crypto-rust",
] }

