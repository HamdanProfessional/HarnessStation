<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#2fd4e8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0b1020" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- rounded tile -->
  <rect x="96" y="96" width="832" height="832" rx="216" fill="url(#g)" filter="url(#sh)"/>
  <!-- H posts + connecting bar -->
  <g stroke="#ffffff" stroke-width="86" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M360 300 V724"/>
    <path d="M664 300 V724"/>
    <path d="M360 512 H664"/>
  </g>
  <!-- central hub node: the station that harnesses the models -->
  <circle cx="512" cy="512" r="104" fill="url(#g)" stroke="#ffffff" stroke-width="58"/>
</svg>
