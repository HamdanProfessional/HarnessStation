name: Release

# Tag a release to publish it:
#   npm version 0.2.0 --no-git-tag-version   (also bump src-tauri/tauri.conf.json + Cargo.toml)
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Optional (Windows Authenticode — without it users see SmartScreen):
#   WINDOWS_CERTIFICATE                 base64 of the .pfx
#   WINDOWS_CERTIFICATE_PASSWORD        its password
#
# NOTE: `plugins.updater.pubkey` is the placeholder REPLACE_WITH_UPDATER_PUBLIC_KEY
# (the old dev key was compromised — see SECURITY.md). Generate a fresh keypair,
# paste its PUBLIC key into tauri.conf.json, and add the private key + password as
# the two TAURI_SIGNING_* secrets before the first signed release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  release:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows
            args: ""
          - platform: ubuntu-22.04
            label: Linux
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev pkg-config

      - run: npm ci

      - name: Decode the Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          "WINDOWS_CERTIFICATE_PATH=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HarnessStation ${{ github.ref_name }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          # Writes latest.json alongside the artifacts — the endpoint the app polls.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
