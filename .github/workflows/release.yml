name: Release

# Tag a release to publish it:
#   npm version 0.2.0 --no-git-tag-version   (also bump src-tauri/tauri.conf.json + Cargo.toml)
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   (the compromised dev key was retired in 1ccaf4e; the current
#    plugins.updater.pubkey is the replacement — see docs/release.md)
# Optional (Windows Authenticode — without it users see SmartScreen):
#   WINDOWS_CERTIFICATE                 base64 of the .pfx
#   WINDOWS_CERTIFICATE_PASSWORD        its password
# When the certificate secrets are set, this workflow imports the .pfx into the
# runner's user cert store and passes its thumbprint to the Tauri bundler via a
# --config override, so the NSIS/MSI artifacts are Authenticode-signed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  release:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows
            args: ""
          - platform: ubuntu-22.04
            label: Linux
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev pkg-config

      - run: npm ci

      - name: Decode the Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          "WINDOWS_CERTIFICATE_PATH=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV

      - name: Import the signing certificate and point the bundler at it
        # Decoding alone signs nothing — the Tauri Windows bundler needs the
        # certificate in a store and its thumbprint in the config. The merge
        # config is written to a file so no JSON has to survive shell quoting.
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE_PATH != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $env:WINDOWS_CERTIFICATE_PATH `
            -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $config = @{
            bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } }
          } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path "$env:RUNNER_TEMP\win-sign.json" -Value $config
          "WIN_SIGN_CONFIG=$env:RUNNER_TEMP\win-sign.json" >> $env:GITHUB_ENV

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HarnessStation ${{ github.ref_name }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          # Writes latest.json alongside the artifacts — the endpoint the app polls.
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ env.WIN_SIGN_CONFIG && format('--config {0}', env.WIN_SIGN_CONFIG) || '' }}
