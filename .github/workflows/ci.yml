# Continuous integration.
#
# This repo had no test CI at all — releases ran checks, but a plain push to
# main ran nothing. Two legs matter here:
#
#   - The web tests run on BOTH Linux and Windows. The app is Windows-first
#     and its history includes bugs that only existed on Windows paths (the
#     PowerShell alias trap in run_command, the cmd /C quoting in MCP spawn),
#     so an Ubuntu-only suite would have passed right through them.
#   - The Rust tests and clippy run on Windows, the platform the crate
#     actually ships for. An Ubuntu cargo leg needs the full webkit2gtk stack
#     for Tauri to compile; add it when Linux becomes a shipping target.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --lib
      - run: cargo clippy --lib -- -D warnings
