<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarnessStation — Documentation</title>
    <meta
      name="description"
      content="How to use HarnessStation: run any AI model as an agent, with tools, files, knowledge, voice and browser control, on your own machine."
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Applied before first paint so a light-theme reader never sees a dark flash.
      try {
        const saved = localStorage.getItem("hs-docs-theme");
        const dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
