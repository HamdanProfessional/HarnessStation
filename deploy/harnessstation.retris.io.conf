# harnessstation.retris.io — HarnessStation marketing landing page (static).
#
# Cloudflare-proxied, same pattern as the other retris.io sites on this box
# (hsdocs / hsapi): Cloudflare terminates the browser's TLS at its edge in Full
# mode, and the origin reuses the existing testservers.online certificate to
# secure the Cloudflare→origin hop. No per-hostname certbot run — Full mode
# doesn't validate the origin cert's name.
#
#   sudo ln -s /etc/nginx/sites-available/harnessstation.retris.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl http2;
    server_name harnessstation.retris.io;

    ssl_certificate /etc/letsencrypt/live/testservers.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testservers.online/privkey.pem;

    # Symlink the deploy script (deploy/site.sh) swaps atomically. Releases live
    # in /var/www/hssite/releases/<timestamp>/, so a rollback is one ln command.
    root /var/www/hssite/current;
    index index.html;

    server_tokens off;

    # Multi-page static site: serve /privacy.html for both /privacy.html and the
    # clean /privacy, falling back to the home page for anything unmatched.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Any hashed assets never change contents — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The shell that points at the assets must never be cached stale.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
