# hsapp.retris.io — HarnessStation web app (client-only SPA).
#
# Cloudflare-proxied, same pattern as hsdocs/hsapi: reuse the testservers.online
# cert as the origin cert (Cloudflare terminates browser TLS in Full mode).
#
#   sudo ln -s /etc/nginx/sites-available/hsapp.retris.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl http2;
    server_name hsapp.retris.io;

    ssl_certificate /etc/letsencrypt/live/testservers.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testservers.online/privkey.pem;

    root /var/www/hsapp/current;
    index index.html;

    server_tokens off;
    # The Whisper/Kokoro WASM is ~21 MB; allow it and generous headroom.
    client_max_body_size 4m;

    # The app keeps its routing in memory (no deep URLs yet), but serve the shell
    # for anything that isn't a real file so a refresh or a future route works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets never change — cache hard. Includes the WASM, which
    # Cloudflare compresses and caches at its edge, so the origin serves it raw
    # (on-the-fly gzip of 21 MB per request would only burn CPU).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Correct type so the browser can stream-compile the module.
    location ~ \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html points at the hashed assets — never cache it, or a returning
    # visitor loads a shell referencing files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
