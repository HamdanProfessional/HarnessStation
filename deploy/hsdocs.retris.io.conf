# hsdocs.retris.io — HarnessStation documentation (static).
#
# Cloudflare-proxied, so this follows the same pattern as the other retris.io
# sites on this box (see test.retris.io): Cloudflare terminates the browser's
# TLS at its edge in Full mode, and the origin reuses the existing
# testservers.online certificate to secure the Cloudflare→origin hop. No
# per-hostname certbot run — Full mode doesn't validate the origin cert's name.
#
#   sudo ln -s /etc/nginx/sites-available/hsdocs.retris.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl http2;
    server_name hsdocs.retris.io;

    ssl_certificate /etc/letsencrypt/live/testservers.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testservers.online/privkey.pem;

    # Points at a symlink the deploy script swaps atomically. Releases live in
    # /var/www/hsdocs/releases/<timestamp>/, so a rollback is one ln command.
    root /var/www/hsdocs/current;
    index index.html;

    server_tokens off;

    # Clean URLs: /guide/tools is a route, not a file. Anything that isn't a real
    # file falls back to the app shell, which renders the right page. Without
    # this every deep link 404s — including every link anyone has shared.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset filenames contain a content hash, so a URL's contents never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html points at the hashed assets, so a stale copy sends returning
    # visitors to files that no longer exist. Never cache it.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /404.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
