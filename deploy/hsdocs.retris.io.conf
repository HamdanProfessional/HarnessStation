# nginx site for the HarnessStation documentation.
#
#   sudo cp deploy/hsdocs.retris.io.conf /etc/nginx/sites-available/hsdocs
#   sudo ln -s /etc/nginx/sites-available/hsdocs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot *after* this is serving over plain HTTP — it edits this file to
# add the TLS block and the HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name hsdocs.retris.io;

    # Points at a symlink the deploy script swaps atomically. Releases live in
    # /var/www/hsdocs/releases/<timestamp>/ so a rollback is one ln command.
    root /var/www/hsdocs/current;
    index index.html;

    # Don't advertise the version in error pages and headers.
    server_tokens off;

    # The docs are a single-page app with clean URLs: /guide/tools is a route,
    # not a file. Anything that isn't a real file falls back to the app shell,
    # which then renders the right page. Without this every deep link 404s —
    # including every link anyone has ever shared.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset filenames contain a content hash, so a given URL's contents can
    # never change. Cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NOT be cached. It's what points at the hashed assets, so a
    # stale copy sends returning visitors to files that no longer exist — the
    # classic "I deployed but everyone still sees the old site" failure.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /404.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The site is static and same-origin: no inline scripts, no third-party
    # requests, no frames. These cost nothing and close off the obvious things.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
