# hsapi.retris.io — HarnessStation gateway (benchmarks / shared feeds).
#
# Reverse-proxies to the Node service on 127.0.0.1:8790 (systemd: hs-gateway).
# Cloudflare-proxied, so it reuses the testservers.online cert as the origin
# cert, exactly like hsdocs.retris.io and the other retris.io sites here.
#
#   sudo ln -s /etc/nginx/sites-available/hsapi.retris.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl http2;
    server_name hsapi.retris.io;

    ssl_certificate /etc/letsencrypt/live/testservers.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testservers.online/privkey.pem;

    server_tokens off;

    # Restore the real client IP from Cloudflare. Without it every request looks
    # like it came from a Cloudflare edge address, and the gateway's per-IP rate
    # limiting would bucket all users together and throttle them as one.
    # Scoped to this server block so it changes nothing for the other sites.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # LLM proxy: streamed (SSE) responses that can run for minutes. Turn buffering
    # off so tokens reach the browser as they arrive, and raise the read timeout so
    # a long generation isn't cut off mid-stream. (Exact-match location wins over
    # the prefix `location /` below.)
    location = /api/llm-proxy {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cached in-memory reads; a slow upstream is a bug, not a long poll.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
